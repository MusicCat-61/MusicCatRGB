name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MusicCat.CLVKM.slnx

      - name: Build
        run: dotnet build MusicCat.CLVKM.slnx -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish MusicCat.CLVKM.UI/MusicCat.CLVKM.UI.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -o build

      - name: Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path build/* -DestinationPath "KeyGlowMaster-$tag-win-x64.zip" -Force
          "ASSET=KeyGlowMaster-$tag-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyGlowMaster-win-x64
          path: ${{ env.ASSET }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: KeyGlowMaster ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.ASSET }}
