name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  UI_PROJECT: MusicCat.CLVKM.UI/MusicCat.CLVKM.UI.csproj

jobs:
  release:
    name: KGMaster.exe (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve tag and version
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag     = $env:GITHUB_REF_NAME
            $version = $tag -replace '^[vV]', ''
          }
          else {
            $tag     = "dev-$($env:GITHUB_RUN_NUMBER)"
            $version = "0.0.0-dev.$($env:GITHUB_RUN_NUMBER)"
          }

          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag, file version: $version"

      - name: Restore
        run: dotnet restore MusicCat.CLVKM.slnx

      - name: Publish single-file KGMaster.exe
        shell: pwsh
        run: |
          dotnet publish $env:UI_PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=${{ steps.meta.outputs.version }} `
            -o publish

          if (-not (Test-Path 'publish/KGMaster.exe')) {
            throw 'KGMaster.exe was not produced by dotnet publish'
          }

          $exe = Get-Item 'publish/KGMaster.exe'
          Write-Host ("KGMaster.exe: {0:N1} MB, file version {1}" -f ($exe.Length / 1MB), $exe.VersionInfo.FileVersion)

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'publish/KGMaster.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KGMaster.exe" | Set-Content 'publish/KGMaster.exe.sha256' -Encoding utf8
          Write-Host "SHA-256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGMaster-${{ steps.meta.outputs.tag }}-win-x64
          path: |
            publish/KGMaster.exe
            publish/KGMaster.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: KeyGlowMaster ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            publish/KGMaster.exe
            publish/KGMaster.exe.sha256
